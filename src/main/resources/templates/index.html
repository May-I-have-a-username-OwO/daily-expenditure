<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="index.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="index.js"></script>
        <link href='https://fonts.googleapis.com/css?family=Tilt Neon' rel='stylesheet'>
        <link href='https://fonts.googleapis.com/css?family=Nunito' rel='stylesheet'>
    </head>
    <body>
        <div id="recordAdder">
            <form id="recordAdderForm">
                <h2> Add a Record: </h2>

                <input class="recordAdderInput" type="radio" id="newRecord_expenditure" name="recordType" value="expenditure">
                <label for="newRecord_expenditure">Expenditure</label>
                <input class="recordAdderInput" type="radio" id="newRecord_income" name="recordType" value="income">
                <label for="newRecord_income">Income</label>
                <br>

                <label>Amount: $</label>
                <input class="recordAdderInput" type="text" id="moneySpent" name="amount">
                <br>

                <label>Date/Time: </label>
                <div>
                    <input class="recordAdderInput" type="radio" id="dateTime_Auto" name="dateTimeRadio" value="autoTime">
                    <label for="dateTime_Auto">Auto</label>
                    <br>
                    <input class="recordAdderInput" type="radio" id="dateTime_UserDefine" name="dateTimeRadio" value="userDefineTime">
                    <label for="dateTime_UserDefine">User-Define: </label>
                    <input class="recordAdderInput" type="datetime-local" id="dateTime_UserDefine_Input" name="dateTimeBox">
                    <br>
                </div>

                <label>Purpose: </label>
                <select class="recordAdderInput" id="purpose" name="purpose" onchange="checkIfNewPurpose(this.value)">
                    <option value="undefined">-------</option>
                    <option id="addNewTypeOption" value="newType" onclick="showAddNewType()">Add a New Type...</option>
                </select>
                <div id="addNewTypeDiv">
                    <label>New Type Name: </label>
                    <input class="recordAdderInput" type="text" id="newTypeName">
                    <button class="recordAdderInput" type="button" onclick="addNewType()">Add</button>
                </div>
                <p id="addNewTypeMsg"></p>

                <label>Remark: </label>
                <input class="recordAdderInput" type="text" id="remark" placeholder="(Optional)" name="remark">
                <br>

                <label id="submitRecordMsg"></label><br>
                <button class="recordAdderInput" id="submitRecordButton" type="button" onclick="submitRecord()">Submit</button>

                <div id="hideRecordAdder" onclick="hideRecordAdder()">
                    <label id="hideRecordAdderText">Hide</label>
                </div>
            </form>
        </div>
        <div id="showRecordAdder" onclick="showRecordAdder()">
            <label id="showRecordAdderText">Add a Record</label>
            <br><br>
        </div>


        <div id="incomeExpenditureSummary">
            <div id="chooseRecordDate">
                <div>
                    <label>View: </label>
                    <button type="button" onclick="clickAllRecord()">All</button>
                    <button type="button" onclick="clickMonthRecord()">By Month</button>
                    <button type="button" onclick="clickYearRecord()">By Year</button>
                    <button type="button" onclick="clickExactDateRecord()">By Exact Date</button>
                </div>

                <div id="chooseMonthDiv">
                    <label>Month: </label>
                    <input type="month" id="monthInput">
                    <button type="button" onclick="getRecordByMonth()">Search</button>
                </div>

                <div id="chooseYearDiv">
                    <label>Year: </label>
                    <select id="yearInput">
                        <option value="">- - - -</option>
                    </select>
                    <button type="button" onclick="getRecordByYear()">Search</button>
                </div>

                <div id="chooseExactDateDiv">
                    <label>Record From: </label>
                    <input class="recordDateSelector" id="readRecordFrom" type="date">
                    <label>To: </label>
                    <input class="recordDateSelector" id="readRecordTo" type="date">
                    <button type="button" onclick="getRecordByExactDate($('#readRecordFrom').val(), $('#readRecordTo').val()); hideGoalDiv();">Search</button>
                </div>
            </div>

            <h2 id="whichRecordMsg"></h2>

            <div id="totalIncomeExpenditure">
                <div id="totalExpenditureBox">
                    <h3>Total Expenditure: </h3>
                    <h1 id="totalExpenditure">$--.--</h1>
                    <div id="expenditureGoalDiv">
                        <p id="expenditureGoalText">Goal: &lt;$--.--</p>

                        <label for="showSetExpenditureGoal">Set Goal</label>
                        <button type="button" id="showSetExpenditureGoal" onclick="$('#setExpenditureGoalDiv').toggle('fast')">show/Hide</button>
                        <div id="setExpenditureGoalDiv">
                            <label id="expenditureGoalLabel" for="expenditureGoal">Total Goal: &lt;$</label>
                            <input type="text" id="expenditureGoal">
                            <button type="button" onclick="setGoal($('#expenditureGoal').val(), $('#expenditureGoalText'), '&lt;')">Set</button>
                        </div>
                    </div>
                </div>

                <div id="totalIncomeBox">
                    <h3>Total Income: </h3>
                    <h1 id="totalIncome">$--.--</h1>
                    <div id="incomeGoalDiv">
                        <p id="incomeGoalText">Goal: &gt;$--.--</p>

                        <label for="showSetIncomeGoal">Set Goal</label>
                        <button type="button" id="showSetIncomeGoal" onclick="$('#setIncomeGoalDiv').toggle('fast')">show/Hide</button>
                        <div id="setIncomeGoalDiv">
                            <label id="incomeGoalLabel" for="incomeGoal">Total Goal: &gt;$</label>
                            <input type="text" id="incomeGoal">
                            <button type="button" onclick="setGoal($('#incomeGoal').val(), $('#incomeGoalText'), '&gt;')">Set</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="expenditurePieChart"></div>

            <div id="detailRecords">
                <h2>Detail Records</h2>
                <table id="recordTable">
                    <thead>
                        <tr id="fieldTitle">
                                <th>Record Type</th>
                                <th>Amount</th>
                                <th>DateTime</th>
                                <th>Purpose</th>
                                <th>Remark</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody"></tbody>
                </table>
            </div>
        </div>


        <div>
            <div id="weeklyExpenditure"></div>
        </div>
    </body>
</html>
